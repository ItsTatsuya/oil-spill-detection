# SegFormer-B3 + SAR multi-feature texture stack (amplitude / variance / gradient / GLCM).
# Fixed pipeline: native eval, weighted CE/Dice, fine GLCM, balanced channel norms.

dataset:
  root: ./dataset
  num_classes: 5
  class_names:
    - sea_surface
    - oil_spill
    - look_alike
    - ship
    - land
  class_colors:
    sea_surface: [0, 0, 0]
    oil_spill: [0, 255, 255]
    look_alike: [255, 0, 0]
    ship: [153, 76, 0]
    land: [0, 153, 0]
  train_split: 0.9
  split_seed: 42
  pixel_counts:
    sea_surface: 639414373
    oil_spill: 7294306
    look_alike: 40574671
    ship: 296259
    land: 36357891

model:
  architecture: segformer
  segformer_decoder: hf_mlp
  # B3 > B2 for rare-class capacity; B4/B5 usually need smaller batch/crop on 8GB.
  pretrained_name: nvidia/segformer-b3-finetuned-ade-512-512
  require_local_pretrained: true
  pretrained_cache_dir: ./models/pretrained
  # 4-ch SAR stack: radiometry + texture + edges + 2nd-order texture.
  num_channels: 4
  num_labels: 5
  channel_init: rgb_mean_inflate
  decoder_channels: 768

sar_features:
  channel_1: amplitude          # backscatter (oil/look dark; ships bright)
  channel_2: local_variance     # smoothness (oil often smoother than open sea)
  channel_3: gradient_magnitude # edges (ships sharp; oil more diffuse)
  channel_4: glcm_contrast      # 2nd-order texture (oil vs look-alike cue)
  channel_schema_version: vv_sar_texture_4ch_v1
  glcm_stride: 8                # was 64 — too blurry for slicks
  cache:
    enabled: true

training:
  num_epochs: 220
  # B3 is ~47M params (B2 ~27M): use batch 2 @640 to stay under 8GB; keep eff. batch 16.
  batch_size_per_gpu: 2
  gradient_accumulation_steps: 8
  effective_batch_size: 16
  num_workers: 6
  val_num_workers: 2
  prefetch_factor: 4
  cache_dataloaders_by_phase: true
  persistent_workers: true
  pin_memory: true
  precision: bf16
  torch_compile: false
  validation_profile: fast
  validate_every_n_epochs: 2
  save_every_n_epochs: 10
  keep_top_k_ema_checkpoints: 3
  checkpoint_dir: ./checkpoints/segformer_b3_texture
  log_dir: ./logs/segformer_b3_texture
  gradient_clip_norm: 1.0
  progressive_schedule:
    1: 640
  early_stop_start_epoch: 80
  early_stop_patience_epochs: 45
  early_stop_min_delta: 0.0003
  model_ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
    update_every: 2
    use_for_validation: true
    save_best_ema: true
    device: cpu

optimizer:
  name: adamw
  lr: 3.0e-05
  head_lr_mult: 10.0
  weight_decay: 0.01
  fused: auto
  betas: [0.9, 0.999]
  eps: 1.0e-08

scheduler:
  type: cosine
  warmup_epochs: 5
  min_lr: 2.0e-06

augmentation:
  train:
    crop_size: 640
    crop_strategy: class_aware
    class_aware_crop_probs:
      ship: 0.28
      oil_spill: 0.32
      look_alike: 0.22
      random: 0.18
    horizontal_flip_prob: 0.5
    vertical_flip_prob: 0.3
    rotation_degrees: 15
    speckle_noise:
      enabled: true
      scale_range: [0.05, 0.15]
    copy_paste:
      enabled: true
      paste_prob: 0.45
      max_ships_per_image: 3
      blur_boundary: true
      blur_kernel_size: 3
      allowed_target_classes:
        - sea_surface
      min_allowed_target_fraction: 0.90
      match_local_intensity: true
  test:
    mode: native

loss:
  ce_ignore_index: -100
  ce_label_smoothing: 0.0
  ce_class_weights: median_frequency
  hybrid_loss_weights:
    ce: 1.0
    dice: 1.2
    jaccard: 0.0
    focal: 0.4
  focal:
    gamma: 2.0
    alpha: inverse_frequency
  dice:
    smooth: 1.0
    class_weights: [0.6, 2.2, 1.6, 3.5, 1.0]
  lovasz:
    weight: 0.45
    ramp_start_epoch: 15
    ramp_end_epoch: 50
  boundary:
    weight: 0.0
  confusion_penalty:
    weight: 0.15
    penalize_pairs:
      - [1, 2]
      - [0, 1]
      - [0, 2]
    pair_weights: [2.0, 0.35, 0.5]
    ramp_start_epoch: 15
    ramp_end_epoch: 60
    margin_start: 0.1
    margin_end: 0.35
    margin_ramp_start_epoch: 15
    margin_ramp_end_epoch: 60

curriculum:
  phase_1:
    epochs: [1, 40]
    ship_oversample_factor: 2.5
    oil_spill_oversample_factor: 1.35
    look_alike_oversample_factor: 1.2
    ship_sampling_floor_multiplier: 1.3
  phase_2:
    epochs: [41, 120]
    ship_oversample_factor: 2.6
    oil_spill_oversample_factor: 1.4
    look_alike_oversample_factor: 1.25
    ship_sampling_floor_multiplier: 1.3
  phase_3:
    epochs: [121, 220]
    ship_oversample_factor: 2.0
    oil_spill_oversample_factor: 1.25
    look_alike_oversample_factor: 1.15
    ship_sampling_floor_multiplier: 1.1

inference:
  whole_image:
    enabled: true
    align: 32
  sliding_window:
    enabled: true
    crop_size: 640
    stride: 320
    batch_size: 4
  tta:
    enabled: true
    augmentation_types:
      - original
      - horizontal_flip
      - vertical_flip
    aggregation: mean_softmax
  multiscale:
    enabled: false

evaluation:
  profile: full
  save_predictions: true
  prediction_dir: ./predictions/segformer_b3_texture
