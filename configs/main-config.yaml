dataset:
  root: ./dataset
  num_classes: 5
  class_names:
    - sea_surface
    - oil_spill
    - look_alike
    - ship
    - land
  class_colors:
    sea_surface: [0, 0, 0]
    oil_spill: [0, 255, 255]
    look_alike: [255, 0, 0]
    ship: [153, 76, 0]
    land: [0, 153, 0]
  train_split: 0.9
  split_seed: 42
  pixel_counts:
    sea_surface: 639414373
    oil_spill: 7294306
    look_alike: 40574671
    ship: 296259
    land: 36357891

model:
  architecture: segformer
  segformer_decoder: hf_mlp
  pretrained_name: nvidia/segformer-b2-finetuned-ade-512-512
  require_local_pretrained: true
  pretrained_cache_dir: ./models/pretrained
  num_channels: 4
  num_labels: 5
  channel_init: rgb_mean_inflate
  decoder_channels: 768

sar_features:
  channel_1: amplitude
  channel_2: local_variance
  channel_3: gradient_magnitude
  channel_4: glcm_contrast
  channel_schema_version: vv_singleband_4ch
  cache:
    enabled: true

training:
  num_epochs: 400
  batch_size_per_gpu: 4
  gradient_accumulation_steps: 4
  effective_batch_size: 16
  num_workers: 6
  val_num_workers: 4
  cache_dataloaders_by_phase: true
  persistent_workers: true
  pin_memory: true
  precision: bf16
  validation_profile: fast
  validate_every_n_epochs: 2
  save_every_n_epochs: 10
  keep_top_k_ema_checkpoints: 3
  checkpoint_dir: ./checkpoints/main_b2
  log_dir: ./logs/main_b2
  gradient_clip_norm: 1.0
  progressive_schedule:
    1: 640
  early_stop_start_epoch: 250
  early_stop_patience_epochs: 50
  early_stop_min_delta: 0.0005
  model_ema:
    enabled: false
    decay: 0.9998
    update_after_step: 0
    use_for_validation: false
    save_best_ema: false

optimizer:
  name: adamw
  lr: 3.0e-05
  head_lr_mult: 10.0
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-08

scheduler:
  type: cosine
  warmup_epochs: 5
  min_lr: 2.0e-06

augmentation:
  train:
    crop_size: 640
    crop_strategy: class_aware
    class_aware_crop_probs:
      ship: 0.20
      oil_spill: 0.35
      look_alike: 0.25
      random: 0.20
    horizontal_flip_prob: 0.5
    vertical_flip_prob: 0.3
    rotation_degrees: 15
    speckle_noise:
      enabled: true
      scale_range: [0.05, 0.15]
    copy_paste:
      enabled: true
      paste_prob: 0.45
      max_ships_per_image: 3
      blur_boundary: true
      blur_kernel_size: 3
      allowed_target_classes:
        - sea_surface
        - oil_spill
      min_allowed_target_fraction: 0.85
      match_local_intensity: true
  test:
    resize: 640

loss:
  ce_ignore_index: -100
  ce_label_smoothing: 0.03
  hybrid_loss_weights:
    ce: 0.8
    dice: 1.0
    jaccard: 0.0
    focal: 0.5
  focal:
    gamma: 2.0
    alpha: inverse_frequency
  dice:
    smooth: 1.0
  lovasz:
    weight: 0.75
    ramp_start_epoch: 21
    ramp_end_epoch: 80
  boundary:
    weight: 0.15
    ramp_start_epoch: 21
    ramp_end_epoch: 80
    downsample_factor: 4
  confusion_penalty:
    weight: 0.15
    penalize_pairs:
      - [1, 2]                # Oil vs Look-alike
      - [0, 1]                # Sea vs Oil
      - [0, 2]                # Sea vs Look-alike
    pair_weights: [1.6, 0.25, 0.65]  # <-- 0.65 attacks the 824k false Sea/Look-alike pixels
    ramp_start_epoch: 150
    ramp_end_epoch: 260
    margin_start: 0.1
    margin_end: 0.3
    margin_ramp_start_epoch: 150
    margin_ramp_end_epoch: 260

curriculum:
  phase_1:
    epochs: [1, 50]
    ship_oversample_factor: 2.5
  phase_2:
    epochs: [51, 120]
    ship_oversample_factor: 3.0
    oil_spill_oversample_factor: 1.2
    look_alike_oversample_factor: 1.1
  phase_3:
    epochs: [121, 400]
    ship_oversample_factor: 2.2
    oil_spill_oversample_factor: 1.35
    look_alike_oversample_factor: 1.0
    ship_sampling_floor_multiplier: 1.0

inference:
  tta:
    enabled: false
    augmentation_types:
      - original
      - horizontal_flip
      - vertical_flip
      - rotate_90
      - rotate_180
      - rotate_270
      - hflip_rotate_90
      - hflip_rotate_270
    aggregation: mean_softmax
  multiscale:
    enabled: false
    scales: [0.75, 1.0, 1.25]
    aggregation: mean_softmax

evaluation:
  profile: fast
  save_predictions: true
  prediction_dir: ./predictions/main_b2
